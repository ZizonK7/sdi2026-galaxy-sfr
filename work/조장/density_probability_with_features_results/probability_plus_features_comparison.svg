  <g id="text_29">
   <text style="font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #24415f" x="75.6" y="433.44" transform="rotate(-0 75.6 433.44)">학습 확률 모델 - 고정 확률 모델: 검증 정확도 차이 +0.06%p · 쌍 부트스트랩 95% 구간 [-0.22, +0.32]%p</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #526175" x="75.6" y="461.16" transform="rotate(-0 75.6 461.16)">qG 함수는 고정되지만, 최종 확률은 다른 피처로 보완됩니다. qG의 영향력을 일정하게 강제하는 방식은 아닙니다.</text>
