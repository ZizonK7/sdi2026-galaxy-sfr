  <g id="text_28">
   <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #526175" x="75.6" y="70.56" transform="rotate(-0 75.6 70.56)">고정 확률과 학습 확률을 각각 같은 13개 피처에 추가 · 같은 최종 분류기 · 문턱값 0.5</text>
