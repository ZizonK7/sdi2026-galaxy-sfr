  <g id="text_31">
   <text style="font-size: 9px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #768398" x="75.6" y="486.36" transform="rotate(-0 75.6 486.36)">학습용 보조 확률은 내부 5-fold로 자신을 제외하고 계산했습니다. 기존 검증 자료를 재사용한 탐색 결과입니다.</text>
